name: VALORANT Official News Watch

on:
  schedule:
    - cron: "25 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: valorant-official-news-watch
  cancel-in-progress: false

jobs:
  official-news:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Discover official VALORANT news
        run: bun scripts/valorant-news-watch.mjs

      - name: Stop when there is nothing new
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- docs/editorial/valorant-news-candidates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update review PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BRANCH="automation/valorant-official-news"
          git config user.name "mgp-editorial-bot"
          git config user.email "mgp-editorial-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add docs/editorial/valorant-news-candidates.json
          git commit -m "Update official VALORANT news candidates"
          git push --force-with-lease origin "$BRANCH" || git push --force origin "$BRANCH"

          COUNT="$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')"
          if [ "$COUNT" = "0" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Editorial: review official VALORANT news" \
              --body "Automated official-source discovery for the MG Profile VALORANT feed. Sources are Riot/VALORANT Brasil, VALORANT Esports Brasil and the verified VALORANT // Brasil YouTube channel. Review metadata, localization and duplicates before promoting candidates into the public feed. This workflow never auto-merges."
          fi
