name: Game Lifecycle Watch

on:
  schedule:
    - cron: "5 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mgp-game-lifecycle-watch
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Vassago + Marbas official-source scan
        run: bun scripts/game-lifecycle-watch.mjs

      - name: Stop when there is nothing new
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- docs/editorial/game-lifecycle-candidates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update council review PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          BRANCH="automation/game-lifecycle-watch"
          git config user.name "mgp-life-watch"
          git config user.email "mgp-life-watch@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add docs/editorial/game-lifecycle-candidates.json
          git commit -m "Editorial: update game lifecycle candidates"
          git push --force-with-lease origin "$BRANCH" || git push --force origin "$BRANCH"

          COUNT="$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')"
          if [ "$COUNT" = "0" ]; then
            gh pr create               --base main               --head "$BRANCH"               --title "Council: review live game data changes"               --body "Daily official-source lifecycle review. Vassago owns freshness, Marbas owns automation, and Andrealphus reviews UX/consistency impact. Check candidates against current VALORANT/League pages before changing public data. Official-first, no rumors, no auto-merge."
          fi
