name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate VALORANT data
        run: bun run check:valorant

      - name: Validate editorial automation syntax
        run: node --check scripts/valorant-news-watch.mjs

      - name: Build
        run: bun run build

      - name: Lint changed source files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.ts' '*.tsx')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed TypeScript files to lint."
            exit 0
          fi

          printf 'Linting changed files:\n%s\n' "${files[*]}"
          bunx eslint "${files[@]}" --rule 'prettier/prettier: off'

